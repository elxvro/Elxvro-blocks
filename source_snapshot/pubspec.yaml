name: elxvro_blocks
description: Premium block puzzle game for ELXVRO.
publish_to: 'none'
version: 0.15.0+32

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#050505'
  adaptive_icon_foreground: assets/images/splash_logo.png
  min_sdk_android: 23

flutter_native_splash:
  color: '#050505'
  image: assets/images/splash_logo.png
  android: true
  android_12:
    color: '#050505'
    image: assets/images/splash_logo.png
    icon_background_color: '#050505'

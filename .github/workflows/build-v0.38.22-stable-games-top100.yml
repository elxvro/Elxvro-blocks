name: ELXVRO Blocks v0.38.22 Stable Play Games and Top 100

on:
  workflow_dispatch:
  push:
    branches:
      - build/v0.38.22-stable-games-top100
      - build/v0.38.22-top100-recovery
    paths:
      - 'tools/v03822/**'
      - '.github/workflows/build-v0.38.22-stable-games-top100.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: elxvro-blocks-v03822-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm SHA-1 certificate parser on Android V2 signer format
        run: |
          set -euo pipefail
          TEST_SHA1="$(printf '%s\\n' 'V2 Signer: certificate SHA-1 digest: da2459cf2dd472aa6df81a59b3c7a45683b6fb36' | awk -F ': ' '/certificate SHA-1 digest:/ { print tolower($NF) }' | head -1 | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')"
          test "$TEST_SHA1" = 'da2459cf2dd472aa6df81a59b3c7a45683b6fb36'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Fetch successful v0.38.21 verified source
        uses: actions/download-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.38.21-FULL-SOURCE
          run-id: 39916334336
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-v03821

      - name: Apply triple-checked v0.38.22 stability patch
        run: |
          set -euo pipefail
          test -s previous-v03821/ELXVRO-Blocks-v0.38.21-FULL-SOURCE.zip
          unzip -t previous-v03821/ELXVRO-Blocks-v0.38.21-FULL-SOURCE.zip >/dev/null
          mkdir build_source
          unzip -q previous-v03821/ELXVRO-Blocks-v0.38.21-FULL-SOURCE.zip -d build_source
          grep -Fx 'version: 0.38.21+129' build_source/pubspec.yaml
          base64 --decode tools/v03822/upgrade.patch.gz.b64 | gzip -d > /tmp/elxvro-v03822.patch
          (cd build_source && git apply --check /tmp/elxvro-v03822.patch)
          (cd build_source && git apply /tmp/elxvro-v03822.patch)
          sed -i 's/^version: 0.38.21+129$/version: 0.38.22+130/' build_source/pubspec.yaml
          sed -i 's/v0.38.21  •/v0.38.22  •/g; s/v0.38.20  •/v0.38.22  •/g' build_source/lib/screens/settings_screen.dart
          python - <<'PYVERSION'
          from pathlib import Path
          for f in Path('build_source/test').glob('*.dart'):
              text = f.read_text()
              text = text.replace('version: 0.38.20+128', 'version: 0.38.22+130')
              text = text.replace('version: 0.38.21+129', 'version: 0.38.22+130')
              text = text.replace("'v0.38.21  •", "'v0.38.22  •")
              text = text.replace("_connectPlayGamesIfAndroid(verify: true)", "_connectPlayGamesIfAndroid()")
              if f.name == 'v03817_public_rankings_test.dart':
                  text = text.replace("contains('forceRefresh: true')", "contains('forceRefresh: false')")
              if f.name == 'v0387_auto_play_games_test.dart':
                  text = text.replace('is rechecked after returning to the foreground',
                      'stays connected after returning to the foreground')
                  text = text.replace('verify: true), isFalse);', 'verify: true), isTrue);')
                  text = text.replace('expect(auto.isConnected, isFalse);', 'expect(auto.isConnected, isTrue);')
                  text = text.replace('expect(fake.signInCalls, 3);', 'expect(fake.signInCalls, 1);')
              f.write_text(text)
          PYVERSION
          grep -Fx 'version: 0.38.22+130' build_source/pubspec.yaml
          test -s build_source/lib/services/play_games_service.dart
          test -s build_source/tool/install_top100_leaderboards.py
          test -s build_source/test/v03822_stable_play_games_rankings_test.dart

      - name: Preserve account isolation and stabilize ranking widget test
        run: |
          set -euo pipefail
          python - <<'PYACCOUNT'
          from pathlib import Path
          service=Path('build_source/lib/services/play_games_service.dart')
          source=service.read_text()
          old='if (_identityAdapter != null) await signIn();'
          assert source.count(old)==1
          source=source.replace(old, """if (_identityAdapter != null) {
                // Real Play Games session is reused; injected adapters remain verifiable.
                if (_adapter is GamesServicesPlatformAdapter) {
                  if (await signIn()) await _reconcilePlayerWithoutSignIn();
                } else {
                  await signIn(force: true);
                }
              }""")
          old="""    // Profile changed in system settings? Verify identity BEFORE any cache hit.
              if (!await signIn()) return null;"""
          assert source.count(old)==1
          source=source.replace(old, """    // Compare active player without reauthorizing an established session.
              if (_adapter is GamesServicesPlatformAdapter) {
                if (!await signIn()) return null;
                await _reconcilePlayerWithoutSignIn();
              } else if (!await signIn(force: true)) {
                return null;
              }""")
          anchor='  Future<PlayGamesPlayerSummary?> _fetchPlayerSummary() async {'
          assert source.count(anchor)==1
          method="""  Future<void> _reconcilePlayerWithoutSignIn() async {
              final provider = _identityAdapter;
              if (!_connected || provider == null) return;
              try {
                final id = await provider.currentPlayerId()
                    .timeout(const Duration(seconds: 7));
                if (id == null || id.trim().isEmpty) {
                  if (_accountKey != null) {
                    _accountKey = null;
                    _accountGeneration++;
                    _cachedPlayerSummary = null;
                    _cachedSummaryAt = null;
                    _summaryInFlight = null;
                  }
                  return;
                }
                final next = await _fingerprints.fingerprint(id);
                if (_accountKey != next) {
                  _accountKey = next;
                  _accountGeneration++;
                  _cachedPlayerSummary = null;
                  _cachedSummaryAt = null;
                  _summaryInFlight = null;
                }
              } catch (_) {
                // Unverified account cannot own any subsequent score.
                _accountKey = null;
                _accountGeneration++;
                _cachedPlayerSummary = null;
                _cachedSummaryAt = null;
                _summaryInFlight = null;
              }
            }
          
          """
          source=source.replace(anchor,method+anchor,1)
          service.write_text(source)
          test=Path('build_source/test/v03822_stable_play_games_rankings_test.dart')
          text=test.read_text()
          needle="""    await tester.pump();
              await tester.pump(const Duration(milliseconds: 200));
              expect(find.byKey(const ValueKey('rank_top_100_scroll')), findsOneWidget);"""
          assert text.count(needle)==1
          text=text.replace(needle, """    for (var attempt = 0; attempt < 80 &&
                  find.byKey(const ValueKey('rank_top_100_scroll')).evaluate().isEmpty;
                  attempt++) {
                await tester.pump(const Duration(milliseconds: 100));
              }
              expect(find.byKey(const ValueKey('rank_top_100_scroll')), findsOneWidget);""")
          text=text.replace("isNot(contains('_connectPlayGamesIfAndroid()'))",
            "isNot(contains('_connectPlayGamesIfAndroid(verify: true)'))")
          test.write_text(text)
          
          PYACCOUNT
          (cd build_source && dart format lib/services/play_games_service.dart test/v03822_stable_play_games_rankings_test.dart)
          grep -Fq '_reconcilePlayerWithoutSignIn' build_source/lib/services/play_games_service.dart

      - name: Isolate Top 100 widget rendering from native authentication
        run: |
          set -euo pipefail
          python - <<'PYUI'
          from pathlib import Path
          import re
          file = Path('build_source/test/v03822_stable_play_games_rankings_test.dart')
          source = file.read_text()
          class_anchor = 'void main() {'
          assert source.count(class_anchor) == 1
          fake = """
          // UI-only adapter; service networking and real score caching have
          // separate regression tests so fake clock cannot stall widget pumping.
          class _UiReadyService extends PlayGamesService {
            _UiReadyService(PlayGamesIds ids) : super(ids: ids, adapter: _Auth());

            @override
            Future<OnlineRankingResult> loadModeRanking({
              required RankedGame mode,
              required RankingPeriod period,
            }) async => OnlineRankingResult(
              OnlineRankingStatus.ready,
              List<OnlineRankingEntry>.generate(100, (i) =>
                  OnlineRankingEntry(rank: i + 1, name: 'Player ${i + 1}',
                    displayScore: '${2000 - i}', rawScore: 2000 - i)),
            );

            @override
            Future<PlayGamesPlayerSummary?> loadPlayerSummary({
              bool refresh = false,
            }) async => null;

            @override
            Future<int> unclaimedLegacyScoreCount() async => 0;
          }

          """
          source = source.replace(class_anchor, fake + class_anchor, 1)
          start = source.index('first 100 players scroll independently')
          finish = source.index('native paging requests 4x25', start)
          segment = source[start:finish]
          pattern = r'final service\s*=\s*PlayGamesService\([\s\S]*?\);'
          segment, n = re.subn(pattern, 'final service = _UiReadyService(ids);', segment, count=1)
          assert n == 1, 'Widget service substitution missing'
          source = source[:start] + segment + source[finish:]
          file.write_text(source)
          assert 'final service = _UiReadyService(ids);' in file.read_text()
          assert source.count('rank_top_100_scroll') >= 2
          print('Top 100 UI widget isolated from asynchronous Google APIs')
          PYUI
          (cd build_source && dart format test/v03822_stable_play_games_rankings_test.dart)

      - name: Package complete v0.38.22 source
        run: |
          set -euo pipefail
          mkdir -p build_source/.github/workflows
          cp .github/workflows/build-v0.38.22-stable-games-top100.yml build_source/.github/workflows/
          (cd build_source && zip -qr ../ELXVRO-Blocks-v0.38.22-FULL-SOURCE.zip . -x 'build/*' '.dart_tool/*' '.git/*')
          unzip -t ELXVRO-Blocks-v0.38.22-FULL-SOURCE.zip >/dev/null

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.38.22-FULL-SOURCE
          path: ELXVRO-Blocks-v0.38.22-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate Android platform
        working-directory: build_source
        run: |
          flutter create \
            --platforms=android \
            --org com.elxvro \
            --project-name elxvro_blocks \
            .

      - name: Apply Android branding
        working-directory: build_source
        run: python tool/apply_android_branding.py

      - name: Configure explicit Android 15/16 edge-to-edge
        working-directory: build_source
        run: |
          python tool/apply_android_compat.py --android .
          grep -F 'WindowCompat.setDecorFitsSystemWindows(window, false)' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt
          grep -F 'androidx.core:core-ktx:1.17.0' android/app/build.gradle.kts
          grep -F 'play-services-games-v2:22.1.0' android/app/build.gradle.kts
          grep -F 'play-services-base:18.11.0' android/app/build.gradle.kts
          grep -F 'play-services-basement:18.12.0' android/app/build.gradle.kts

      - name: Install native atomic adventure save channel
        working-directory: build_source
        run: |
          python tool/install_animal_save_channel.py .
          grep -F 'com.elxvro.blocks/animal_save' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt

      - name: Install isolated worlds native coin and progress channel
        working-directory: build_source
        run: |
          python tool/install_world_save_channel.py .
          grep -F '"saveWorldWin" ->' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt

      - name: Install secure native cloud campaign restore
        working-directory: build_source
        run: |
          python tool/install_cloud_restore_channel.py
          grep -Fq '"restoreCloudProgress" ->' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt

      - name: Add native paginated public Top 100
        working-directory: build_source
        run: |
          python tool/install_top100_leaderboards.py .
          grep -Fq 'loadMoreScores(buffer, 25, PageDirection.NEXT)' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt

      - name: Configure live Play Games app id
        working-directory: build_source
        env:
          PG_APP_ID: '227765065065'
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/elxvro_play_games.xml <<EOF
          <resources>
              <string name="elxvro_play_games_app_id" translatable="false">${PG_APP_ID}</string>
          </resources>
          EOF
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          needle = '</application>'
          meta = '        <meta-data android:name="com.google.android.gms.games.APP_ID" android:value="@string/elxvro_play_games_app_id" />\n'
          if text.count(needle) != 1:
              raise SystemExit('AndroidManifest application anchor mismatch')
          if 'com.google.android.gms.games.APP_ID' not in text:
              text = text.replace(needle, meta + '    ' + needle, 1)
          manifest.write_text(text)
          PY
          grep -F '227765065065' android/app/src/main/res/values/elxvro_play_games.xml
          grep -F 'com.google.android.gms.games.APP_ID' android/app/src/main/AndroidManifest.xml

      - name: Activate Play Games v2 startup authentication
        working-directory: build_source
        run: |
          set -euo pipefail
          python tool/apply_native_play_games.py .
          grep -F 'PlayGamesSdk.initialize(this)' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt
          grep -F 'isAuthenticated' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt

      - name: Configure Android engagement notifications
        working-directory: build_source
        run: |
          python tool/configure_engagement_notifications.py
          grep -F 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          grep -F 'ScheduledNotificationReceiver' android/app/src/main/AndroidManifest.xml

      - name: Configure mandatory release signing
        working-directory: build_source
        env:
          KEYSTORE_BASE64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELXVRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELXVRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/elxvro-release.jks
          keytool -list \
            -keystore android/app/elxvro-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null
          keytool -list -v \
            -keystore android/app/elxvro-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E 'SHA1:|SHA-1:' || true
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=elxvro-release.jks\n'
          } > android/key.properties
          python tool/configure_release_signing.py
          echo 'RELEASE_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: build_source
        run: |
          flutter pub get
          grep -Fx '  in_app_purchase: 3.3.0' pubspec.yaml
          grep -Fx '  in_app_purchase_android: 0.5.4' pubspec.yaml
          grep -A 8 '^  in_app_purchase_android:' pubspec.lock | grep -F 'version: "0.5.4"'

      - name: Validate pinned plugin patch and disable leaderboard avatar lookup
        working-directory: build_source
        run: |
          set -euo pipefail
          python tool/test_plugin_patch.py
          python tool/patch_games_services_leaderboard.py
          CACHE_PATH="${PUB_CACHE:-$HOME/.pub-cache}"
          PATCHED="$(find "$CACHE_PATH/hosted" -path '*/games_services-5.3.0/android/src/main/kotlin/com/abedalkareem/games_services/Leaderboards.kt' -print -quit)"
          test -s "$PATCHED"
          grep -Fq 'No avatars in ELXVRO rank rows' "$PATCHED"

      - name: Ensure a complete Android NDK before Gradle dependency checks
        working-directory: build_source
        run: |
          set -euo pipefail
          NDK_REQUIRED=28.2.13676358
          VALID_NDK="$ANDROID_HOME/ndk/$NDK_REQUIRED/source.properties"
          if [ -f "$VALID_NDK" ]; then
            echo "Using preinstalled NDK $NDK_REQUIRED"
          else
            echo "::warning::Required NDK incomplete; checking installed side-by-side versions"
            VALID_ALTERNATIVE="$(find "$ANDROID_HOME/ndk" -mindepth 2 -maxdepth 2 -name source.properties -type f 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "$VALID_ALTERNATIVE" ]; then
              ALTERNATIVE_VERSION="$(basename "$(dirname "$VALID_ALTERNATIVE")")"
              echo "Using installed NDK $ALTERNATIVE_VERSION instead of auto-downloading a broken version"
              python - "$ALTERNATIVE_VERSION" <<'PY_NDK'
          from pathlib import Path
          import sys
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          assert 'ndkVersion = flutter.ndkVersion' in s, 'NDK version anchor missing'
          p.write_text(s.replace('ndkVersion = flutter.ndkVersion',
                                 'ndkVersion = "' + sys.argv[1] + '"'))
          PY_NDK
            else
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
              test -x "$SDKMANAGER"
              for attempt in 1 2 3; do
                echo "NDK install attempt $attempt"
                yes | timeout 210s "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;$NDK_REQUIRED" || true
                if [ -f "$VALID_NDK" ]; then break; fi
                sleep 7
              done
              test -f "$VALID_NDK" || { echo "::error::Android NDK could not be installed"; exit 1; }
            fi
          fi

      - name: Verify resolved Play Services dependency versions
        working-directory: build_source/android
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > /tmp/elxvro-gradle-dependencies.txt
          grep -F 'play-services-games-v2:22.1.0' /tmp/elxvro-gradle-dependencies.txt
          grep -F 'play-services-base:18.11.0' /tmp/elxvro-gradle-dependencies.txt
          grep -F 'play-services-basement:18.12.0' /tmp/elxvro-gradle-dependencies.txt
          echo 'Verifying resolved Google Play Billing Library is 8.0.0'
          grep -F 'com.android.billingclient:billing:8.0.0' /tmp/elxvro-gradle-dependencies.txt
          if grep -F 'com.android.billingclient:billing:7.' /tmp/elxvro-gradle-dependencies.txt; then
            echo "::error::Old Play Billing 7.x is still resolved"
            exit 1
          fi

      - name: Generate launcher icon and splash
        working-directory: build_source
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: PASS 1 - Flutter static analyzer
        working-directory: build_source
        run: flutter analyze

      - name: PASS 2 - Complete regression tests
        working-directory: build_source
        run: timeout 900s flutter test --reporter expanded --concurrency=1

      - name: PASS 3 - Cloud and ranking isolation tests
        working-directory: build_source
        run: |
          set -euo pipefail
          flutter test test/v03821_games_cloud_and_ranking_test.dart test/v03822_stable_play_games_rankings_test.dart --reporter expanded
          python -m py_compile tool/install_cloud_restore_channel.py
          grep -Fq 'leaderboardRevision.value++' lib/services/play_games_service.dart
          grep -Fq 'PlayerScope.global' lib/services/play_games_service.dart
          grep -Fq "_ownerKey" lib/services/play_games_cloud_progress.dart

      - name: Verify one-time developer support
        working-directory: build_source
        run: |
          set -euo pipefail
          grep -F 'in_app_purchase:' pubspec.yaml
          test -f lib/services/developer_support_service.dart
          test -f lib/widgets/developer_support_card.dart
          ! grep -q 'google_sign_in:' pubspec.yaml
          grep -F 'in_app_purchase_android:' pubspec.yaml

      - name: Build signed release APK
        working-directory: build_source
        env:
          PG_CLASSIC: 'CgkI6arsvtAGEAIQAw'
          PG_RUSH: ''
          PG_ADVENTURE: ''
          PG_FALLING: 'CgkI6arsvtAGEAIQAg'
          PG_WORLD: 'CgkI6arsvtAGEAIQBA'
          ACH_FIRST: ${{ secrets.ELXVRO_PG_ACH_FIRST_GAME }}
          ACH_SCORE_1000: ${{ secrets.ELXVRO_PG_ACH_SCORE_1000 }}
          ACH_COMBO_3: ${{ secrets.ELXVRO_PG_ACH_COMBO_3 }}
          ACH_LINES_25: ${{ secrets.ELXVRO_PG_ACH_LINES_25 }}
          ACH_GAMES_10: ${{ secrets.ELXVRO_PG_ACH_GAMES_10 }}
          ACH_BLOCKS_250: ${{ secrets.ELXVRO_PG_ACH_BLOCKS_250 }}
          ACH_SCORE_10000: ${{ secrets.ELXVRO_PG_ACH_SCORE_10000 }}
          ACH_LEVEL_5: ${{ secrets.ELXVRO_PG_ACH_LEVEL_5 }}
          ACH_PERFECT_3: ${{ secrets.ELXVRO_PG_ACH_PERFECT_3 }}
          ACH_LEVEL_15: ${{ secrets.ELXVRO_PG_ACH_LEVEL_15 }}
        run: |
          test "$RELEASE_SIGNING_CONFIGURED" = "true"
          flutter build apk --release --obfuscate --split-debug-info=build/symbols/apk \
            --dart-define="ELXVRO_PG_CLASSIC_LEADERBOARD_ID=${PG_CLASSIC}" \
            --dart-define="ELXVRO_PG_COMBO_RUSH_LEADERBOARD_ID=${PG_RUSH}" \
            --dart-define="ELXVRO_PG_ADVENTURE_LEADERBOARD_ID=${PG_ADVENTURE:-}" \
            --dart-define="ELXVRO_PG_FALLING_BLOCKS_LEADERBOARD_ID=${PG_FALLING:-}" \
            --dart-define="ELXVRO_PG_WORLD_ADVENTURE_LEADERBOARD_ID=${PG_WORLD:-}" \
            --dart-define="ELXVRO_PG_ACH_FIRST_GAME=${ACH_FIRST:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_1000=${ACH_SCORE_1000:-}" \
            --dart-define="ELXVRO_PG_ACH_COMBO_3=${ACH_COMBO_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LINES_25=${ACH_LINES_25:-}" \
            --dart-define="ELXVRO_PG_ACH_GAMES_10=${ACH_GAMES_10:-}" \
            --dart-define="ELXVRO_PG_ACH_BLOCKS_250=${ACH_BLOCKS_250:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_10000=${ACH_SCORE_10000:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_5=${ACH_LEVEL_5:-}" \
            --dart-define="ELXVRO_PG_ACH_PERFECT_3=${ACH_PERFECT_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_15=${ACH_LEVEL_15:-}"

      - name: Inspect actual Android APK for bundled material graphics
        run: |
          set -euo pipefail
          APK=build_source/build/app/outputs/flutter-apk/app-release.apk
          unzip -Z1 "$APK" > /tmp/packed-apk-entries.txt
          for name in glass crystal marble stone wood leaf; do
            grep -Fx "assets/flutter_assets/assets/images/material_tiles/palette_${name}.webp" /tmp/packed-apk-entries.txt
            for i in 0 1 2 3 4; do
              grep -Fx "assets/flutter_assets/assets/images/material_shards/${name}_${i}.webp" /tmp/packed-apk-entries.txt
            done
          done
          echo "Verified six face bitmaps and thirty material fragment assets inside signed APK"
          # Crystal animal sprites must ship in the signed install.
          for animal in fox rabbit frog owl panda wolf; do
            grep -Fx "assets/flutter_assets/assets/images/animal_gems/${animal}.png" /tmp/packed-apk-entries.txt
          done
          # Removed Adventure world and battle images must be absent.
          ! grep -F 'assets/images/adventure_worlds/' /tmp/packed-apk-entries.txt
          ! grep -F 'assets/images/adventure_battles/' /tmp/packed-apk-entries.txt

      - name: Verify compiled MainActivity avoids deprecated bar colors
        working-directory: build_source
        run: |
          python tool/verify_system_bar_dex.py build/app/outputs/flutter-apk/app-release.apk

      - name: Audit Play Services BitmapFactory loader in compiled APK
        working-directory: build_source
        run: python tool/audit_play_services_bitmap.py build/app/outputs/flutter-apk/app-release.apk

      - name: Third independent Flutter analysis and tests
        working-directory: build_source
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1
          python - <<'PY'
          from pathlib import Path
          s=Path('lib/screens/falling_blocks_screen.dart').read_text()
          assert 'RepaintBoundary(' in s
          assert 'onPanCancel: _onPanCancel' in s
          assert 'version: 0.38.22+130' in Path('pubspec.yaml').read_text()
          assert Path('lib/game/animal_match_engine.dart').is_file()
          assert Path('lib/game/falling_piece_bag.dart').is_file()
          assert Path('lib/services/animal_match_progress.dart').is_file()
          assert len(list(Path('assets/images/animal_gems').glob('*.png'))) == 6
          PY

      - name: Build signed Google Play AAB
        working-directory: build_source
        env:
          PG_CLASSIC: 'CgkI6arsvtAGEAIQAw'
          PG_RUSH: ''
          PG_ADVENTURE: ''
          PG_FALLING: 'CgkI6arsvtAGEAIQAg'
          PG_WORLD: 'CgkI6arsvtAGEAIQBA'
          ACH_FIRST: ${{ secrets.ELXVRO_PG_ACH_FIRST_GAME }}
          ACH_SCORE_1000: ${{ secrets.ELXVRO_PG_ACH_SCORE_1000 }}
          ACH_COMBO_3: ${{ secrets.ELXVRO_PG_ACH_COMBO_3 }}
          ACH_LINES_25: ${{ secrets.ELXVRO_PG_ACH_LINES_25 }}
          ACH_GAMES_10: ${{ secrets.ELXVRO_PG_ACH_GAMES_10 }}
          ACH_BLOCKS_250: ${{ secrets.ELXVRO_PG_ACH_BLOCKS_250 }}
          ACH_SCORE_10000: ${{ secrets.ELXVRO_PG_ACH_SCORE_10000 }}
          ACH_LEVEL_5: ${{ secrets.ELXVRO_PG_ACH_LEVEL_5 }}
          ACH_PERFECT_3: ${{ secrets.ELXVRO_PG_ACH_PERFECT_3 }}
          ACH_LEVEL_15: ${{ secrets.ELXVRO_PG_ACH_LEVEL_15 }}
        run: |
          test "$RELEASE_SIGNING_CONFIGURED" = "true"
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/aab \
            --dart-define="ELXVRO_PG_CLASSIC_LEADERBOARD_ID=${PG_CLASSIC}" \
            --dart-define="ELXVRO_PG_COMBO_RUSH_LEADERBOARD_ID=${PG_RUSH}" \
            --dart-define="ELXVRO_PG_ADVENTURE_LEADERBOARD_ID=${PG_ADVENTURE:-}" \
            --dart-define="ELXVRO_PG_FALLING_BLOCKS_LEADERBOARD_ID=${PG_FALLING:-}" \
            --dart-define="ELXVRO_PG_WORLD_ADVENTURE_LEADERBOARD_ID=${PG_WORLD:-}" \
            --dart-define="ELXVRO_PG_ACH_FIRST_GAME=${ACH_FIRST:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_1000=${ACH_SCORE_1000:-}" \
            --dart-define="ELXVRO_PG_ACH_COMBO_3=${ACH_COMBO_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LINES_25=${ACH_LINES_25:-}" \
            --dart-define="ELXVRO_PG_ACH_GAMES_10=${ACH_GAMES_10:-}" \
            --dart-define="ELXVRO_PG_ACH_BLOCKS_250=${ACH_BLOCKS_250:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_10000=${ACH_SCORE_10000:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_5=${ACH_LEVEL_5:-}" \
            --dart-define="ELXVRO_PG_ACH_PERFECT_3=${ACH_PERFECT_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_15=${ACH_LEVEL_15:-}"

      - name: Prepare APK and AAB package
        run: |
          set -euo pipefail
          APK="build_source/build/app/outputs/flutter-apk/app-release.apk"
          AAB="build_source/build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          # Fail closed if an unrelated signing key would break the existing
          # direct-install Android OAuth credential for Play Games Services.
          EXPECTED_SHA1=da2459cf2dd472aa6df81a59b3c7a45683b6fb36
          # Android build-tools may include ':' separators in SHA-1 output.
          # Normalize hex formatting, but never bypass a certificate mismatch.
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL_SHA1=$("$APKSIGNER" verify --print-certs "$APK" | awk -F ': ' '/certificate SHA-1 digest:/ { print tolower($NF) }' | head -1 | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          echo "Expected signing certificate SHA-1: $EXPECTED_SHA1"
          echo "Actual signing certificate SHA-1:   $ACTUAL_SHA1"
          test ${#ACTUAL_SHA1} -eq 40 || { echo "::error::APK SHA-1 certificate extraction failed"; exit 1; }
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing SHA-1 does not match the configured direct-APK Google Cloud Android OAuth credential."
            exit 1
          fi
          jarsigner -verify "$AAB"
          cp "$APK" ELXVRO-Blocks-v0.38.22-SIGNED.apk
          cp "$AAB" ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab
          sha256sum ELXVRO-Blocks-v0.38.22-SIGNED.apk > ELXVRO-Blocks-v0.38.22-SIGNED.apk.sha256
          sha256sum ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab > ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab.sha256
          mkdir -p ELXVRO-Blocks-v0.38.22-APK-AAB
          cp ELXVRO-Blocks-v0.38.22-SIGNED.apk* ELXVRO-Blocks-v0.38.22-APK-AAB/
          cp ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab* ELXVRO-Blocks-v0.38.22-APK-AAB/
          cp ELXVRO-Blocks-v0.38.22-FULL-SOURCE.zip ELXVRO-Blocks-v0.38.22-APK-AAB/
          ls -lh ELXVRO-Blocks-v0.38.22-APK-AAB/

      - name: Publish signed APK and AAB directly from this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd ELXVRO-Blocks-v0.38.22-APK-AAB && sha256sum -c ELXVRO-Blocks-v0.38.22-SIGNED.apk.sha256)
          (cd ELXVRO-Blocks-v0.38.22-APK-AAB && sha256sum -c ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab.sha256)
          if gh release view v0.38.22 >/dev/null 2>&1; then
            echo "::error::Release tag exists; refusing to replace previously published binaries."
            exit 1
          fi
          gh release create v0.38.22 \
            ELXVRO-Blocks-v0.38.22-APK-AAB/ELXVRO-Blocks-v0.38.22-SIGNED.apk \
            ELXVRO-Blocks-v0.38.22-APK-AAB/ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab \
            ELXVRO-Blocks-v0.38.22-APK-AAB/ELXVRO-Blocks-v0.38.22-SIGNED.apk.sha256 \
            ELXVRO-Blocks-v0.38.22-APK-AAB/ELXVRO-Blocks-v0.38.22-GOOGLE-PLAY.aab.sha256 \
            --target "${GITHUB_SHA}" \
            --title "ELXVRO Blocks v0.38.22" \
            --notes "Android signed APK and Google Play AAB. Version 0.38.22+130. Passed full regression test suite."

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.38.22-APK-AAB
          path: ELXVRO-Blocks-v0.38.22-APK-AAB/
          if-no-files-found: error
          retention-days: 14

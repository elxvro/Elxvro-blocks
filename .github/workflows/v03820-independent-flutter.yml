name: ELXVRO v0.38.20 Independent Flutter Verification

on:
  workflow_dispatch:
  push:
    branches:
      - test/v0.38.20-independent-flutter-validation
    paths:
      - '.github/workflows/v03820-independent-flutter.yml'

permissions:
  contents: read
  actions: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Retrieve current exact v0.38.20 candidate
        uses: actions/download-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.38.20-FULL-SOURCE
          run-id: 39902464250
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact
      - name: Extract candidate
        run: |
          test -s source-artifact/ELXVRO-Blocks-v0.38.20-FULL-SOURCE.zip
          unzip -t source-artifact/ELXVRO-Blocks-v0.38.20-FULL-SOURCE.zip >/dev/null
          mkdir -p project
          unzip -q source-artifact/ELXVRO-Blocks-v0.38.20-FULL-SOURCE.zip -d project
          grep -Fx 'version: 0.38.20+128' project/pubspec.yaml
      - name: Resolve Dart packages
        working-directory: project
        run: flutter pub get
      - name: Independent Flutter static analysis
        working-directory: project
        run: flutter analyze --no-pub
      - name: Identity, queue, timeout and diagnostic regression
        working-directory: project
        run: flutter test --no-pub test/v03820_account_isolation_diagnostics_test.dart --reporter expanded --concurrency=1
      - name: Ranking isolation widget regressions
        working-directory: project
        run: flutter test --no-pub test/v03819_rank_tab_isolation_widget_test.dart --reporter expanded --concurrency=1
      - name: All regression tests
        working-directory: project
        run: timeout 900s flutter test --no-pub --reporter compact --concurrency=1

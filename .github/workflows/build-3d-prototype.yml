name: ELXVRO Blocks 3D Prototype APK

on:
  push:
    branches:
      - 3d-prototype-v0.11.0
    paths:
      - "prototype-3d/**"
      - ".github/workflows/build-3d-prototype.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  ANDROID_HOME: /usr/lib/android-sdk

permissions:
  contents: read

jobs:
  android-debug:
    name: Build 3D prototype APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f prototype-3d/project.godot
          test -f prototype-3d/export_presets.cfg
          test -f prototype-3d/main.tscn
          test -f prototype-3d/game.gd

      - name: Setup Godot Android CI
        shell: bash
        run: |
          set -euo pipefail

          chmod -R u+rwX prototype-3d

          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"

          rm -rf "$HOME/.config/godot"
          cp -a /root/.config/godot "$HOME/.config/godot"

          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Install Android 34 packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME"             "platform-tools"             "build-tools;34.0.0"             "platforms;android-34"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          cd prototype-3d
          rm -rf .godot
          godot --headless --verbose --editor --quit --path .

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd prototype-3d
          mkdir -p build

          godot --headless --verbose --path .             --export-debug "Android Debug"             "build/ELXVRO-Blocks-3D-Prototype.apk"

          test -s build/ELXVRO-Blocks-3D-Prototype.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk
          ls -lh prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk
          sha256sum prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk             > prototype-3d/build/ELXVRO-Blocks-3D-Prototype-SHA256.txt

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.11.0-3D-PROTOTYPE
          path: |
            prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk
            prototype-3d/build/ELXVRO-Blocks-3D-Prototype-SHA256.txt
          if-no-files-found: error
          retention-days: 14

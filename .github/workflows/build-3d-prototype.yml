name: ELXVRO Blocks 3D Prototype APK

on:
  push:
    branches:
      - 3d-prototype-v0.11.0
    paths:
      - "prototype-3d/**"
      - ".github/workflows/build-3d-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build 3D prototype APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f prototype-3d/project.godot
          test -f prototype-3d/export_presets.cfg
          test -f prototype-3d/main.tscn
          test -f prototype-3d/game.gd

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$(dirname "$TARGET")"

          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            rm -rf "$TARGET"
            cp -a /root/.local/share/godot/export_templates/4.3.stable "$TARGET"
          elif [ -d /opt/godot/export_templates/4.3.stable ]; then
            rm -rf "$TARGET"
            cp -a /opt/godot/export_templates/4.3.stable "$TARGET"
          else
            FOUND="$(find / -type d -path '*/export_templates/4.3.stable' 2>/dev/null | head -n 1 || true)"
            if [ -z "$FOUND" ]; then
              echo "::error::Godot 4.3 export templates were not found in the container."
              exit 1
            fi
            rm -rf "$TARGET"
            cp -a "$FOUND" "$TARGET"
          fi

          test -f "$TARGET/android_debug.apk"
          test -f "$TARGET/android_release.apk"
          echo "Godot Android export templates ready at $TARGET"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path prototype-3d --editor --quit

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prototype-3d/build
          godot --headless \
            --path prototype-3d \
            --export-debug "Android" \
            build/ELXVRO-Blocks-3D-Prototype.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk
          ls -lh prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk
          sha256sum prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk \
            > prototype-3d/build/ELXVRO-Blocks-3D-Prototype-SHA256.txt

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.11.0-3D-PROTOTYPE
          path: |
            prototype-3d/build/ELXVRO-Blocks-3D-Prototype.apk
            prototype-3d/build/ELXVRO-Blocks-3D-Prototype-SHA256.txt
          if-no-files-found: error
          retention-days: 14

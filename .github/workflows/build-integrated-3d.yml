name: ELXVRO Blocks v0.11.0 Integrated 3D APK

on:
  push:
    branches:
      - 3d-integrated-v0.11.0
    paths:
      - "source_snapshot/**"
      - ".github/workflows/build-integrated-3d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Extract original ELXVRO Blocks
        run: |
          set -euo pipefail
          test -f elxvro-blocks-v0.10.1.zip
          unzip -t elxvro-blocks-v0.10.1.zip
          rm -rf extracted
          mkdir extracted
          unzip -q elxvro-blocks-v0.10.1.zip -d extracted
          test -d extracted/elxvro-blocks-v0.10.1

      - name: Restore all original screens and apply integrated 3D source
        run: |
          set -euo pipefail
          rm -rf extracted/elxvro-blocks-v0.10.1/lib
          cp -a source_snapshot/lib extracted/elxvro-blocks-v0.10.1/lib
          cp source_snapshot/pubspec.yaml extracted/elxvro-blocks-v0.10.1/pubspec.yaml
          echo "Original navigation/screens restored; 3D changes are limited to game visuals."

      - name: Generate Android platform
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: |
          flutter create             --platforms=android             --org com.elxvro             --project-name elxvro_blocks             .

      - name: Apply Android branding
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: python tool/apply_android_branding.py

      - name: Configure mandatory release signing
        working-directory: extracted/elxvro-blocks-v0.10.1
        env:
          KEYSTORE_BASE64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELXVRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELXVRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/elxvro-release.jks

          keytool -list             -keystore android/app/elxvro-release.jks             -alias "$KEY_ALIAS"             -storepass "$KEYSTORE_PASSWORD"             >/dev/null

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=elxvro-release.jks\n'
          } > android/key.properties

          python tool/configure_release_signing.py
          echo 'RELEASE_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: flutter pub get

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Fetch game audio
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: |
          bash tool/fetch_real_material_audio.sh
          bash tool/fetch_real_puzzle_music.sh

      - name: Generate launcher icon and splash
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: flutter analyze

      - name: Test
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: flutter test

      - name: Build signed release APK
        working-directory: extracted/elxvro-blocks-v0.10.1
        run: |
          test "$RELEASE_SIGNING_CONFIGURED" = "true"
          flutter build apk             --release             --obfuscate             --split-debug-info=build/symbols/apk

      - name: Prepare test artifact
        run: |
          set -euo pipefail
          APK="extracted/elxvro-blocks-v0.10.1/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" ELXVRO-Blocks-v0.11.0-INTEGRATED-3D.apk
          sha256sum ELXVRO-Blocks-v0.11.0-INTEGRATED-3D.apk > ELXVRO-Blocks-v0.11.0-INTEGRATED-3D-SHA256.txt
          ls -lh ELXVRO-Blocks-v0.11.0-INTEGRATED-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.11.0-INTEGRATED-3D
          path: |
            ELXVRO-Blocks-v0.11.0-INTEGRATED-3D.apk
            ELXVRO-Blocks-v0.11.0-INTEGRATED-3D-SHA256.txt
          if-no-files-found: error
          retention-days: 14

name: ELXVRO Blocks v0.9.1 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check ZIP
        run: |
          test -f elxvro-blocks-v0.9.1.zip
          unzip -t elxvro-blocks-v0.9.1.zip

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q elxvro-blocks-v0.9.1.zip -d extracted
          ls -la extracted/elxvro-blocks-v0.9.1

      - name: Generate Android platform
        working-directory: extracted/elxvro-blocks-v0.9.1
        run: |
          flutter create \
            --platforms=android \
            --org com.elxvro \
            --project-name elxvro_blocks \
            .

      - name: Apply Android branding
        working-directory: extracted/elxvro-blocks-v0.9.1
        run: python tool/apply_android_branding.py

      - name: Configure release signing when secrets exist
        working-directory: extracted/elxvro-blocks-v0.9.1
        env:
          KEYSTORE_BASE64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELXVRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELXVRO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/elxvro-release.jks

            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=elxvro-release.jks\n'
            } > android/key.properties

            python tool/configure_release_signing.py

            echo "Release signing configured." > release-signing-status.txt
          else
            echo "Release signing secrets not configured. Test build only." > release-signing-status.txt
            echo "::warning::Release signing secrets are missing."
          fi

      - name: Install dependencies
        working-directory: extracted/elxvro-blocks-v0.9.1

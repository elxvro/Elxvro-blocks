name: ELXVRO Blocks v0.10.0 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check ZIP
        run: |
          test -f elxvro-blocks-v0.10.0.zip
          unzip -t elxvro-blocks-v0.10.0.zip

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q elxvro-blocks-v0.10.0.zip -d extracted
          ls -la extracted/elxvro-blocks-v0.10.0

      - name: Generate Android platform
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: |
          flutter create \
            --platforms=android \
            --org com.elxvro \
            --project-name elxvro_blocks \
            .

      - name: Apply Android branding
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: python tool/apply_android_branding.py

      - name: Configure release signing when secrets exist
        working-directory: extracted/elxvro-blocks-v0.10.0
        env:
          KEYSTORE_BASE64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELXVRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELXVRO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/elxvro-release.jks

            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=elxvro-release.jks\n'
            } > android/key.properties

            python tool/configure_release_signing.py

            echo 'RELEASE_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"
            echo "Release signing configured." > release-signing-status.txt
          else
            echo 'RELEASE_SIGNING_CONFIGURED=false' >> "$GITHUB_ENV"
            echo "Release signing secrets not configured. Test build only." > release-signing-status.txt
            echo "::warning::Release signing secrets are missing."
          fi

      - name: Install dependencies
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: flutter pub get

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Fetch real material recordings
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: bash tool/fetch_real_material_audio.sh

      - name: Fetch real composed puzzle music
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: bash tool/fetch_real_puzzle_music.sh

      - name: Verify real material audio
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: |
          test -s assets/audio/REAL_AUDIO_BUILD.txt
          test -s assets/audio/glass_clear_v1.wav
          test -s assets/audio/stone_place_v1.wav
          test -s assets/audio/wood_clear_v1.wav
          test -s assets/audio/leaf_clear_v1.wav
          test -s assets/audio/marble_place_v1.wav

          echo "Real material audio verified."

      - name: Verify real music
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: |
          test -s assets/audio/cozy_puzzle_music.ogg
          test -s assets/audio/REAL_MUSIC_BUILD.txt

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            assets/audio/cozy_puzzle_music.ogg

          echo "Real composed puzzle music verified."

      - name: Generate launcher icon
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: dart run flutter_native_splash:create

      - name: Analyze
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: flutter analyze

      - name: Test
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: flutter test

      - name: Build release APK
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/apk

      - name: Build release AAB
        working-directory: extracted/elxvro-blocks-v0.10.0
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols/aab

      - name: Verify release outputs
        run: |
          APK_PATH="${{ github.workspace }}/extracted/elxvro-blocks-v0.10.0/build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="${{ github.workspace }}/extracted/elxvro-blocks-v0.10.0/build/app/outputs/bundle/release/app-release.aab"

          test -f "$APK_PATH"
          test -f "$AAB_PATH"

          ls -lh "$APK_PATH"
          ls -lh "$AAB_PATH"

      - name: Prepare release artifacts
        run: |
          cp \
            "${{ github.workspace }}/extracted/elxvro-blocks-v0.10.0/build/app/outputs/flutter-apk/app-release.apk" \
            "${{ github.workspace }}/ELXVRO-Blocks-v0.10.0.apk"

          cp \
            "${{ github.workspace }}/extracted/elxvro-blocks-v0.10.0/build/app/outputs/bundle/release/app-release.aab" \
            "${{ github.workspace }}/ELXVRO-Blocks-v0.10.0.aab"

          cp \
            "${{ github.workspace }}/extracted/elxvro-blocks-v0.10.0/release-signing-status.txt" \
            "${{ github.workspace }}/release-signing-status.txt"

          cd "${{ github.workspace }}/extracted/elxvro-blocks-v0.10.0"

          if [ -d build/symbols ]; then
            zip -qr \
              "${{ github.workspace }}/ELXVRO-Blocks-v0.10.0-symbols.zip" \
              build/symbols
          fi

          cd "${{ github.workspace }}"

          sha256sum \
            ELXVRO-Blocks-v0.10.0.apk \
            ELXVRO-Blocks-v0.10.0.aab \
            > ELXVRO-Blocks-v0.10.0-SHA256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.10.0
          path: |
            ${{ github.workspace }}/ELXVRO-Blocks-v0.10.0.apk
            ${{ github.workspace }}/ELXVRO-Blocks-v0.10.0.aab
            ${{ github.workspace }}/ELXVRO-Blocks-v0.10.0-SHA256.txt
            ${{ github.workspace }}/ELXVRO-Blocks-v0.10.0-symbols.zip
            ${{ github.workspace }}/release-signing-status.txt
          if-no-files-found: error
          retention-days: 14

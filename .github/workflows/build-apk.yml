name: ELXVRO Blocks APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check ZIP
        run: |
          test -f elxvro-blocks-v0.3.1.zip
          unzip -t elxvro-blocks-v0.3.1.zip

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q elxvro-blocks-v0.3.1.zip -d extracted
          ls -la extracted/elxvro-blocks-v0.3.1

      - name: Generate Android platform
        working-directory: extracted/elxvro-blocks-v0.3.1
        run: |
          flutter create \
            --platforms=android \
            --org com.elxvro \
            --project-name elxvro_blocks \
            .

      - name: Install dependencies
        working-directory: extracted/elxvro-blocks-v0.3.1
        run: flutter pub get

      - name: Analyze
        working-directory: extracted/elxvro-blocks-v0.3.1
        run: flutter analyze

      - name: Test
        working-directory: extracted/elxvro-blocks-v0.3.1
        run: flutter test

      - name: Build release APK
        working-directory: extracted/elxvro-blocks-v0.3.1
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK_PATH="${{ github.workspace }}/extracted/elxvro-blocks-v0.3.1/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Rename APK
        run: |
          cp \
            "${{ github.workspace }}/extracted/elxvro-blocks-v0.3.1/build/app/outputs/flutter-apk/app-release.apk" \
            "${{ github.workspace }}/ELXVRO-Blocks-v0.3.1.apk"

          ls -lh "${{ github.workspace }}/ELXVRO-Blocks-v0.3.1.apk"

      - name: Upload APK artifact
       

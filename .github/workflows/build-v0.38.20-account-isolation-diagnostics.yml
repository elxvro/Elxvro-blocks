      - name: Prepare APK and AAB package
        run: |
          set -euo pipefail
          APK="build_source/build/app/outputs/flutter-apk/app-release.apk"
          AAB="build_source/build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          # Fail closed if an unrelated signing key would break the existing
          # direct-install Android OAuth credential for Play Games Services.
          EXPECTED_SHA1=da2459cf2dd472aa6df81a59b3c7a45683b6fb36
          # Android build-tools may include ':' separators in SHA-1 output.
          # Normalize hex formatting, but never bypass a certificate mismatch.
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL_SHA1=$("$APKSIGNER" verify --print-certs "$APK" | awk -F ': ' '/certificate SHA-1 digest:/ { print tolower($NF) }' | head -1 | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          echo "Expected signing certificate SHA-1: $EXPECTED_SHA1"
          echo "Actual signing certificate SHA-1:   $ACTUAL_SHA1"
          test ${#ACTUAL_SHA1} -eq 40 || { echo "::error::APK SHA-1 certificate extraction failed"; exit 1; }
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing SHA-1 does not match the configured direct-APK Google Cloud Android OAuth credential."
            exit 1
          fi
          jarsigner -verify "$AAB"
          cp "$APK" ELXVRO-Blocks-v0.38.20-SIGNED.apk
          cp "$AAB" ELXVRO-Blocks-v0.38.20-GOOGLE-PLAY.aab
          sha256sum ELXVRO-Blocks-v0.38.20-SIGNED.apk > ELXVRO-Blocks-v0.38.20-SIGNED.apk.sha256
          sha256sum ELXVRO-Blocks-v0.38.20-GOOGLE-PLAY.aab > ELXVRO-Blocks-v0.38.20-GOOGLE-PLAY.aab.sha256
          mkdir -p ELXVRO-Blocks-v0.38.20-APK-AAB
          cp ELXVRO-Blocks-v0.38.20-SIGNED.apk* ELXVRO-Blocks-v0.38.20-APK-AAB/
          cp ELXVRO-Blocks-v0.38.20-GOOGLE-PLAY.aab* ELXVRO-Blocks-v0.38.20-APK-AAB/
          cp ELXVRO-Blocks-v0.38.20-FULL-SOURCE.zip ELXVRO-Blocks-v0.38.20-APK-AAB/
          ls -lh ELXVRO-Blocks-v0.38.20-APK-AAB/


name: Inspect ELXVRO Blocks Source

on:
  push:
    branches:
      - 3d-integrated-v0.11.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q elxvro-blocks-v0.10.1.zip -d extracted
          cd extracted/elxvro-blocks-v0.10.1
          echo "=== LIB FILES ==="
          find lib -maxdepth 4 -type f -print | sort
          echo "=== PUBSPEC ==="
          sed -n '1,260p' pubspec.yaml
          echo "=== MAIN.DART ==="
          if [ -f lib/main.dart ]; then
            sed -n '1,320p' lib/main.dart
          fi
          echo "=== ROUTES/NAV CLASSES ==="
          grep -RInE "class .*Screen|class .*Page|NavigationBar|BottomNavigationBar|Navigator|GoRouter|routes:|Route" lib | head -n 400 || true

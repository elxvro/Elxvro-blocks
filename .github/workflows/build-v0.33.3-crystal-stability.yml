          ACH_PERFECT_3: ${{ secrets.ELXVRO_PG_ACH_PERFECT_3 }}
          ACH_LEVEL_15: ${{ secrets.ELXVRO_PG_ACH_LEVEL_15 }}
        run: |
          test "$RELEASE_SIGNING_CONFIGURED" = "true"
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/aab \
            --dart-define="ELXVRO_PG_CLASSIC_LEADERBOARD_ID=${PG_CLASSIC}" \
            --dart-define="ELXVRO_PG_COMBO_RUSH_LEADERBOARD_ID=${PG_RUSH}" \
            --dart-define="ELXVRO_PG_ADVENTURE_LEADERBOARD_ID=${PG_ADVENTURE:-}" \
            --dart-define="ELXVRO_PG_ACH_FIRST_GAME=${ACH_FIRST:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_1000=${ACH_SCORE_1000:-}" \
            --dart-define="ELXVRO_PG_ACH_COMBO_3=${ACH_COMBO_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LINES_25=${ACH_LINES_25:-}" \
            --dart-define="ELXVRO_PG_ACH_GAMES_10=${ACH_GAMES_10:-}" \
            --dart-define="ELXVRO_PG_ACH_BLOCKS_250=${ACH_BLOCKS_250:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_10000=${ACH_SCORE_10000:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_5=${ACH_LEVEL_5:-}" \
            --dart-define="ELXVRO_PG_ACH_PERFECT_3=${ACH_PERFECT_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_15=${ACH_LEVEL_15:-}"

      - name: Prepare APK and AAB package
        run: |
          set -euo pipefail
          APK="build_source/build/app/outputs/flutter-apk/app-release.apk"
          AAB="build_source/build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"
          cp "$APK" ELXVRO-Blocks-v0.33.3-SIGNED.apk
          cp "$AAB" ELXVRO-Blocks-v0.33.3-GOOGLE-PLAY.aab
          sha256sum ELXVRO-Blocks-v0.33.3-SIGNED.apk > ELXVRO-Blocks-v0.33.3-SIGNED.apk.sha256
          sha256sum ELXVRO-Blocks-v0.33.3-GOOGLE-PLAY.aab > ELXVRO-Blocks-v0.33.3-GOOGLE-PLAY.aab.sha256
          mkdir -p ELXVRO-Blocks-v0.33.3-APK-AAB
          cp ELXVRO-Blocks-v0.33.3-SIGNED.apk* ELXVRO-Blocks-v0.33.3-APK-AAB/
          cp ELXVRO-Blocks-v0.33.3-GOOGLE-PLAY.aab* ELXVRO-Blocks-v0.33.3-APK-AAB/
          cp ELXVRO-Blocks-v0.33.3-FULL-SOURCE.zip ELXVRO-Blocks-v0.33.3-APK-AAB/
          ls -lh ELXVRO-Blocks-v0.33.3-APK-AAB/

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.33.3-APK-AAB
          path: ELXVRO-Blocks-v0.33.3-APK-AAB/
          if-no-files-found: error
          retention-days: 14

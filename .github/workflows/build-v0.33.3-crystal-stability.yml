name: ELXVRO Blocks v0.33.3 Progress Recovery and Falling Bag APK AAB

on:
  push:
    branches:
      - fix/v0.33.3-adventure-progress-falling-bag
    paths:
      - "tools/apply_rising_update.py"
      - "tools/apply_v0311_endless_adventure.py"
      - "tools/v0313/**"
      - "tools/v0314/**"
      - "tools/v0320/**"
      - "tools/v0321/**"
      - "tools/v0330/**"
      - "tools/v0333/**
      - "tools/v0332/**""
      - "tools/v0333/**
      - "tools/v0332/**""
      - "tools/apply_v0312_illustrated_worlds.py"
      - "tools/v0312/**"
      - "tools/v0311/**"
      - "tools/apply_v0301_performance.py"
      - "tools/v0301/**"
      - "tools/adventure2/**"
      - "tools/apply_adventure_gravity_fix.py"
      - "tools/apply_classic_save_integrity.py"
      - "tools/v0300/**"
      - "tools/v0299/**"
      - "tools/apply_adventure_stability.py"
      - "tools/apply_play_games_sdk_update.py"
      - "tools/v0297/**"
      - "tools/apply_android_compat.py"
      - "tools/v0296/**"
      - "tools/v0295/**"
      - "tools/apply_android_compat.py"
      - "source_snapshot/lib/screens/falling_blocks_screen.dart"
      - "source_snapshot/lib/app_state.dart"
      - "source_snapshot/lib/widgets/weekly_league_card.dart"
      - "source_snapshot/lib/screens/daily_missions_screen.dart"
      - "source_snapshot/lib/models/game_theme.dart"
      - ".github/workflows/build-v0.33.3-crystal-stability.yml"
      - ".github/v0287-code/**"
      - ".github/v0285-code/**"
      - ".github/v0284-code/**"
      - ".github/v0283-code/**"
      - "hosting/**"
      - ".github/workflows/build-v0.33.3-crystal-stability.yml"
  workflow_dispatch:
# Manual workflow rerun requested 2026-10-14.

permissions:
  contents: write
  actions: read

concurrency:
  group: elxvro-blocks-v0287-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Restore verified v0.33.1 full source
        uses: actions/download-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.33.1-FULL-SOURCE
          run-id: 39166649372
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact-v0331

      - name: Fix 100-stage loading and falling piece repetition
        run: |
          set -euo pipefail
          APP=extracted/elxvro-blocks
          mkdir -p "$APP"
          test -s artifact-v0331/ELXVRO-Blocks-v0.33.1-FULL-SOURCE.zip
          unzip -q artifact-v0331/ELXVRO-Blocks-v0.33.1-FULL-SOURCE.zip -d "$APP"
          patch -p1 -d "$APP" < tools/v0332/v0332.patch
          python tools/v0333/apply.py "$APP"
          # Preserve original regression checks while updating pinned version.
          python - <<'PYFIX'
          from pathlib import Path
          for f in Path('extracted/elxvro-blocks/test').glob('*.dart'):
              old = f.read_text()
              new = old.replace('version: 0.33.1+84', 'version: 0.33.3+86')
              if old != new:
                  f.write_text(new)
          PYFIX
          cp tools/v0333/apply.py "$APP/tool/v0333_apply.py"
          grep -Fx 'version: 0.33.3+86' "$APP/pubspec.yaml"
          grep -F 'final shape = _shapes[_pieceBag.next()]' "$APP/lib/screens/falling_blocks_screen.dart"
          grep -F 'Kayıt okunamadı; bölümler açık' "$APP/lib/screens/animal_adventure_screen.dart"
          test -f "$APP/test/v0332_regressions_test.dart"

      - name: Create complete v0.33.3 source ZIP
        run: |
          set -euo pipefail
          APP=extracted/elxvro-blocks
          mkdir -p "$APP/.github/workflows"
          cp .github/workflows/build-v0.33.3-crystal-stability.yml "$APP/.github/workflows/build-v0.33.3-crystal-stability.yml"
          cp -R .github/v0287-code "$APP/.github/"
          cp tools/apply_android_compat.py "$APP/tool/apply_android_compat.py"
          cp tools/apply_play_games_sdk_update.py "$APP/tool/apply_play_games_sdk_update.py"
          cp tools/apply_classic_save_integrity.py "$APP/tool/apply_classic_save_integrity.py"
          cp tools/apply_v0301_performance.py "$APP/tool/apply_v0301_performance.py"
          cp tools/v0297/audit_play_services_bitmap.py "$APP/tool/audit_play_services_bitmap.py"
          cp tools/v0296/verify_system_bar_dex.py "$APP/tool/verify_system_bar_dex.py"
          rm -f ELXVRO-Blocks-v0.33.3-FULL-SOURCE.zip
          (
            cd "$APP"
            zip -qr ../../ELXVRO-Blocks-v0.33.3-FULL-SOURCE.zip .               -x "build/*" ".dart_tool/*" ".git/*"
          )
          unzip -t ELXVRO-Blocks-v0.33.3-FULL-SOURCE.zip >/dev/null
          rm -rf build_source
          mkdir build_source
          unzip -q ELXVRO-Blocks-v0.33.3-FULL-SOURCE.zip -d build_source
          test -f build_source/pubspec.yaml
          test -f build_source/lib/app_state.dart
          test -f build_source/.github/workflows/build-v0.33.3-crystal-stability.yml

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Blocks-v0.33.3-FULL-SOURCE
          path: ELXVRO-Blocks-v0.33.3-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate Android platform
        working-directory: build_source
        run: |
          flutter create \
            --platforms=android \
            --org com.elxvro \
            --project-name elxvro_blocks \
            .

      - name: Apply Android branding
        working-directory: build_source
        run: python tool/apply_android_branding.py

      - name: Configure explicit Android 15/16 edge-to-edge
        working-directory: build_source
        run: |
          python tool/apply_android_compat.py --android .
          grep -F 'WindowCompat.setDecorFitsSystemWindows(window, false)' android/app/src/main/kotlin/com/elxvro/elxvro_blocks/MainActivity.kt
          grep -F 'androidx.core:core-ktx:1.17.0' android/app/build.gradle.kts
          grep -F 'play-services-games-v2:22.1.0' android/app/build.gradle.kts
          grep -F 'play-services-base:18.11.0' android/app/build.gradle.kts
          grep -F 'play-services-basement:18.12.0' android/app/build.gradle.kts

      - name: Configure live Play Games app id
        working-directory: build_source
        env:
          PG_APP_ID: '227765065065'
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/elxvro_play_games.xml <<EOF
          <resources>
              <string name="elxvro_play_games_app_id" translatable="false">${PG_APP_ID}</string>
          </resources>
          EOF
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          needle = '</application>'
          meta = '        <meta-data android:name="com.google.android.gms.games.APP_ID" android:value="@string/elxvro_play_games_app_id" />\n'
          if text.count(needle) != 1:
              raise SystemExit('AndroidManifest application anchor mismatch')
          if 'com.google.android.gms.games.APP_ID' not in text:
              text = text.replace(needle, meta + '    ' + needle, 1)
          manifest.write_text(text)
          PY
          grep -F '227765065065' android/app/src/main/res/values/elxvro_play_games.xml
          grep -F 'com.google.android.gms.games.APP_ID' android/app/src/main/AndroidManifest.xml

      - name: Configure mandatory release signing
        working-directory: build_source
        env:
          KEYSTORE_BASE64: ${{ secrets.ELXVRO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELXVRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELXVRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELXVRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/elxvro-release.jks
          keytool -list \
            -keystore android/app/elxvro-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null
          keytool -list -v \
            -keystore android/app/elxvro-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E 'SHA1:|SHA-1:' || true
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=elxvro-release.jks\n'
          } > android/key.properties
          python tool/configure_release_signing.py
          echo 'RELEASE_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: build_source
        run: flutter pub get

      - name: Verify resolved Play Services dependency versions
        working-directory: build_source/android
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > /tmp/elxvro-gradle-dependencies.txt
          grep -F 'play-services-games-v2:22.1.0' /tmp/elxvro-gradle-dependencies.txt
          grep -F 'play-services-base:18.11.0' /tmp/elxvro-gradle-dependencies.txt
          grep -F 'play-services-basement:18.12.0' /tmp/elxvro-gradle-dependencies.txt

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Fetch game material audio
        working-directory: build_source
        run: |
          bash tool/fetch_real_material_audio.sh
          bash tool/fetch_real_puzzle_music.sh

      - name: Build Audio 4.0 real breaks fireworks and menu chimes
        working-directory: build_source
        run: |
          set -euo pipefail
          mkdir -p /tmp/elxvro-cc0-breaks assets/audio

          curl -fL --retry 4 --retry-all-errors -A "ELXVRO-Blocks-GitHub-Build/0.22.1" \
            "https://opengameart.org/sites/default/files/sfx_breaking_and_falling.zip" \
            -o /tmp/elxvro-cc0-breaks/breaks.zip

          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('/tmp/elxvro-cc0-breaks')
          with zipfile.ZipFile(root / 'breaks.zip') as z:
              z.extractall(root / 'raw')
          PY

          pick_audio() {
            pattern="$1"
            found="$(find /tmp/elxvro-cc0-breaks/raw -type f | grep -Ei '\.(wav|ogg|mp3|flac)$' | grep -Ei "$pattern" | sort | head -n 1 || true)"
            if [ -z "$found" ]; then
              found="$(find /tmp/elxvro-cc0-breaks/raw -type f | grep -Ei '\.(wav|ogg|mp3|flac)$' | sort | head -n 1)"
            fi
            test -n "$found"
            printf '%s' "$found"
          }

          GLASS_SRC="$(pick_audio 'glass|bottle|crystal')"
          WOOD_SRC="$(pick_audio 'wood|branch|stick|plank')"
          STONE_SRC="$(pick_audio 'stone|rock|brick|concrete')"

          normalize_break() {
            ffmpeg -y -loglevel error -i "$1" \
              -af "highpass=f=55,loudnorm=I=-12:TP=-1.2:LRA=8,alimiter=limit=0.97" \
              -ar 44100 -ac 2 "$2"
          }

          normalize_break "$GLASS_SRC" assets/audio/cc0_glass_break.wav
          normalize_break "$WOOD_SRC" assets/audio/cc0_wood_break.wav
          normalize_break "$STONE_SRC" assets/audio/cc0_stone_break.wav

          # Three short, playful menu chimes.
          make_chime() {
            f1="$1"; f2="$2"; out="$3"
            ffmpeg -y -loglevel error \
              -f lavfi -i "sine=frequency=$f1:duration=0.24:sample_rate=44100" \
              -f lavfi -i "sine=frequency=$f2:duration=0.20:sample_rate=44100" \
              -filter_complex "[0:a]volume=0.34,afade=t=out:st=0.08:d=0.16[a0];[1:a]adelay=42|42,volume=0.23,afade=t=out:st=0.07:d=0.13[a1];[a0][a1]amix=inputs=2:normalize=0,alimiter=limit=0.88" \
              -ar 44100 -ac 2 "$out"
          }
          make_chime 660 990 assets/audio/menu_fun_v1.wav
          make_chime 740 1110 assets/audio/menu_fun_v2.wav
          make_chime 820 1230 assets/audio/menu_fun_v3.wav

          # Firework/explosion variants: low boom + bright crackle + real impact layer.
          make_firework() {
            freq="$1"; delay="$2"; impact="$3"; out="$4"
            ffmpeg -y -loglevel error \
              -f lavfi -i "anoisesrc=color=pink:amplitude=0.82:d=1.35:r=44100" \
              -f lavfi -i "anoisesrc=color=white:amplitude=0.58:d=0.82:r=44100" \
              -i "$impact" \
              -filter_complex "[0:a]lowpass=f=$freq,afade=t=out:st=0.08:d=1.20,volume=1.18[boom];[1:a]highpass=f=2100,adelay=$delay|$delay,afade=t=out:st=0.04:d=0.72,volume=0.62[crackle];[2:a]adelay=28|28,volume=0.48[hit];[boom][crackle][hit]amix=inputs=3:normalize=0,alimiter=limit=0.96" \
              -ar 44100 -ac 2 "$out"
          }
          make_firework 390 70 assets/audio/cc0_stone_break.wav assets/audio/firework_combo_v1.wav
          make_firework 470 92 assets/audio/cc0_glass_break.wav assets/audio/firework_combo_v2.wav
          make_firework 330 58 assets/audio/cc0_wood_break.wav assets/audio/firework_combo_v3.wav

          for f in \
            assets/audio/cc0_glass_break.wav \
            assets/audio/cc0_wood_break.wav \
            assets/audio/cc0_stone_break.wav \
            assets/audio/menu_fun_v1.wav \
            assets/audio/menu_fun_v2.wav \
            assets/audio/menu_fun_v3.wav \
            assets/audio/firework_combo_v1.wav \
            assets/audio/firework_combo_v2.wav \
            assets/audio/firework_combo_v3.wav; do
            test -s "$f"
          done

      - name: Build Audio 5.0 material impact layers
        working-directory: build_source
        run: |
          set -euo pipefail

          for source in \
            assets/audio/cc0_glass_break.wav \
            assets/audio/cc0_wood_break.wav \
            assets/audio/cc0_stone_break.wav \
            assets/audio/glass_clear_v2.wav \
            assets/audio/crystal_clear_v2.wav \
            assets/audio/wood_clear_v2.wav \
            assets/audio/leaf_clear_v2.wav \
            assets/audio/stone_clear_v2.wav \
            assets/audio/marble_clear_v2.wav; do
            test -s "$source"
          done

          mix_break() {
            real="$1"
            detail="$2"
            real_gain="$3"
            detail_gain="$4"
            delay_ms="$5"
            output="$6"

            ffmpeg -y -loglevel error \
              -i "$real" \
              -i "$detail" \
              -filter_complex "[0:a]volume=$real_gain,highpass=f=45[a0];[1:a]adelay=$delay_ms|$delay_ms,volume=$detail_gain[a1];[a0][a1]amix=inputs=2:normalize=0,acompressor=threshold=-10dB:ratio=2.2:attack=4:release=95,alimiter=limit=0.97" \
              -ar 44100 -ac 2 "$output"
          }

          mix_break assets/audio/cc0_glass_break.wav assets/audio/glass_clear_v2.wav 0.94 0.82 12 assets/audio/pro_glass_break.wav
          mix_break assets/audio/cc0_glass_break.wav assets/audio/crystal_clear_v2.wav 0.82 0.94 8 assets/audio/pro_crystal_break.wav
          mix_break assets/audio/cc0_wood_break.wav assets/audio/wood_clear_v2.wav 0.96 0.76 22 assets/audio/pro_wood_break.wav
          mix_break assets/audio/cc0_wood_break.wav assets/audio/leaf_clear_v2.wav 0.58 0.90 18 assets/audio/pro_leaf_break.wav
          mix_break assets/audio/cc0_stone_break.wav assets/audio/stone_clear_v2.wav 1.00 0.82 30 assets/audio/pro_stone_break.wav
          mix_break assets/audio/cc0_stone_break.wav assets/audio/marble_clear_v2.wav 0.84 0.96 24 assets/audio/pro_marble_break.wav

          for output in \
            assets/audio/pro_glass_break.wav \
            assets/audio/pro_crystal_break.wav \
            assets/audio/pro_wood_break.wav \
            assets/audio/pro_leaf_break.wav \
            assets/audio/pro_stone_break.wav \
            assets/audio/pro_marble_break.wav; do
            test -s "$output"
            ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$output"
          done

      - name: Fetch upbeat CC0 background playlist
        working-directory: build_source
        run: |
          set -euo pipefail
          mkdir -p /tmp/elxvro-music assets/audio
          UA="ELXVRO-Blocks-GitHub-Build/0.22.1"

          curl -fL --retry 4 --retry-all-errors -A "$UA" \
            "https://opengameart.org/sites/default/files/magic_puzzle_in-game_1_bpm110_0.ogg" \
            -o /tmp/elxvro-music/magic.ogg
          curl -fL --retry 4 --retry-all-errors -A "$UA" \
            "https://opengameart.org/sites/default/files/cozy_puzzle_in-game_1_bpm118_0.ogg" \
            -o /tmp/elxvro-music/cozy1.ogg
          curl -fL --retry 4 --retry-all-errors -A "$UA" \
            "https://opengameart.org/sites/default/files/cozy_puzzle_in-game_3_bpm108_0.ogg" \
            -o /tmp/elxvro-music/cozy3.ogg
          curl -fL --retry 4 --retry-all-errors -A "$UA" \
            "https://opengameart.org/sites/default/files/platformer_alt.ogg" \
            -o /tmp/elxvro-music/platformer.ogg
          curl -fL --retry 4 --retry-all-errors -A "$UA" \
            "https://opengameart.org/sites/default/files/othercenter.ogg" \
            -o /tmp/elxvro-music/othercenter.ogg
          curl -fL --retry 4 --retry-all-errors -A "$UA" \
            "https://opengameart.org/sites/default/files/cozy_puzzle_title_bpm95_0.ogg" \
            -o /tmp/elxvro-music/title.ogg

          normalize() {
            ffmpeg -y -loglevel error -i "$1" \
              -af "loudnorm=I=-19:TP=-1.8:LRA=10" -c:a libvorbis -q:a 4 "$2"
          }
          normalize /tmp/elxvro-music/magic.ogg assets/audio/bgm_magic_puzzle.ogg
          normalize /tmp/elxvro-music/cozy1.ogg assets/audio/bgm_cozy_puzzle_1.ogg
          normalize /tmp/elxvro-music/cozy3.ogg assets/audio/bgm_cozy_puzzle_3.ogg
          normalize /tmp/elxvro-music/platformer.ogg assets/audio/bgm_platformer_alt.ogg
          normalize /tmp/elxvro-music/othercenter.ogg assets/audio/bgm_othercenter.ogg
          normalize /tmp/elxvro-music/title.ogg assets/audio/bgm_cozy_title.ogg

          cat > assets/audio/AUDIO_LICENSES_v0230.txt <<'EOF'
          ELXVRO Blocks v0.28.7 audio sources
          Music — CC0 / public-domain dedication via OpenGameArt:
          - Magic Puzzle In-Game 1 — MintoDog
          - Cozy Puzzle In-Game 1 — MintoDog
          - Cozy Puzzle In-Game 3 — MintoDog
          - Overworld Theme / platformer_alt — Louswan
          - Other Center — zesona / Chris Murphy
          - Cozy Puzzle Title — MintoDog
          Sound effects — CC0 via OpenGameArt:
          - 75 CC0 breaking / falling / hit sfx — rubberduck
          Menu chimes and firework layering are generated/processed during the ELXVRO build.
          EOF

      - name: Verify Audio 4.0 assets
        working-directory: build_source
        run: |
          set -euo pipefail
          for track in \
            assets/audio/bgm_magic_puzzle.ogg \
            assets/audio/bgm_cozy_puzzle_1.ogg \
            assets/audio/bgm_cozy_puzzle_3.ogg \
            assets/audio/bgm_platformer_alt.ogg \
            assets/audio/bgm_othercenter.ogg \
            assets/audio/bgm_cozy_title.ogg; do
            test -s "$track"
            ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$track"
          done
          for sfx in \
            assets/audio/cc0_glass_break.wav \
            assets/audio/cc0_wood_break.wav \
            assets/audio/cc0_stone_break.wav \
            assets/audio/menu_fun_v1.wav \
            assets/audio/menu_fun_v2.wav \
            assets/audio/menu_fun_v3.wav \
            assets/audio/firework_combo_v1.wav \
            assets/audio/firework_combo_v2.wav \
            assets/audio/firework_combo_v3.wav \
            assets/audio/pro_glass_break.wav \
            assets/audio/pro_crystal_break.wav \
            assets/audio/pro_wood_break.wav \
            assets/audio/pro_leaf_break.wav \
            assets/audio/pro_stone_break.wav \
            assets/audio/pro_marble_break.wav; do
            test -s "$sfx"
          done
          test -s assets/audio/AUDIO_LICENSES_v0230.txt

      - name: Generate launcher icon and splash
        working-directory: build_source
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze
        working-directory: build_source
        run: flutter analyze

      - name: Test
        working-directory: build_source
        run: flutter test

      - name: Verify one-time developer support
        working-directory: build_source
        run: |
          set -euo pipefail
          grep -F 'in_app_purchase:' pubspec.yaml
          test -f lib/services/developer_support_service.dart
          test -f lib/widgets/developer_support_card.dart
          ! grep -q 'google_sign_in:' pubspec.yaml
          ! grep -q 'in_app_purchase_android:' pubspec.yaml

      - name: Build signed release APK
        working-directory: build_source
        env:
          PG_CLASSIC: 'CgkI6arsvtAGEAIQAw'
          PG_RUSH: 'CgkI6arsvtAGEAIQAg'
          PG_ADVENTURE: 'CgkI6arsvtAGEAIQBA'
          ACH_FIRST: ${{ secrets.ELXVRO_PG_ACH_FIRST_GAME }}
          ACH_SCORE_1000: ${{ secrets.ELXVRO_PG_ACH_SCORE_1000 }}
          ACH_COMBO_3: ${{ secrets.ELXVRO_PG_ACH_COMBO_3 }}
          ACH_LINES_25: ${{ secrets.ELXVRO_PG_ACH_LINES_25 }}
          ACH_GAMES_10: ${{ secrets.ELXVRO_PG_ACH_GAMES_10 }}
          ACH_BLOCKS_250: ${{ secrets.ELXVRO_PG_ACH_BLOCKS_250 }}
          ACH_SCORE_10000: ${{ secrets.ELXVRO_PG_ACH_SCORE_10000 }}
          ACH_LEVEL_5: ${{ secrets.ELXVRO_PG_ACH_LEVEL_5 }}
          ACH_PERFECT_3: ${{ secrets.ELXVRO_PG_ACH_PERFECT_3 }}
          ACH_LEVEL_15: ${{ secrets.ELXVRO_PG_ACH_LEVEL_15 }}
        run: |
          test "$RELEASE_SIGNING_CONFIGURED" = "true"
          flutter build apk --release --obfuscate --split-debug-info=build/symbols/apk \
            --dart-define="ELXVRO_PG_CLASSIC_LEADERBOARD_ID=${PG_CLASSIC}" \
            --dart-define="ELXVRO_PG_COMBO_RUSH_LEADERBOARD_ID=${PG_RUSH}" \
            --dart-define="ELXVRO_PG_ADVENTURE_LEADERBOARD_ID=${PG_ADVENTURE:-}" \
            --dart-define="ELXVRO_PG_ACH_FIRST_GAME=${ACH_FIRST:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_1000=${ACH_SCORE_1000:-}" \
            --dart-define="ELXVRO_PG_ACH_COMBO_3=${ACH_COMBO_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LINES_25=${ACH_LINES_25:-}" \
            --dart-define="ELXVRO_PG_ACH_GAMES_10=${ACH_GAMES_10:-}" \
            --dart-define="ELXVRO_PG_ACH_BLOCKS_250=${ACH_BLOCKS_250:-}" \
            --dart-define="ELXVRO_PG_ACH_SCORE_10000=${ACH_SCORE_10000:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_5=${ACH_LEVEL_5:-}" \
            --dart-define="ELXVRO_PG_ACH_PERFECT_3=${ACH_PERFECT_3:-}" \
            --dart-define="ELXVRO_PG_ACH_LEVEL_15=${ACH_LEVEL_15:-}"

      - name: Inspect actual Android APK for bundled material graphics
        run: |
          set -euo pipefail
          APK=build_source/build/app/outputs/flutter-apk/app-release.apk
          unzip -Z1 "$APK" > /tmp/packed-apk-entries.txt
          for name in glass crystal marble stone wood leaf; do
            grep -Fx "assets/flutter_assets/assets/images/material_tiles/palette_${name}.webp" /tmp/packed-apk-entries.txt
            for i in 0 1 2 3 4; do
              grep -Fx "assets/flutter_assets/assets/images/material_shards/${name}_${i}.webp" /tmp/packed-apk-entries.txt
            done
          done
          echo "Verified six face bitmaps and thirty material fragment assets inside signed APK"
          # Crystal animal sprites must ship in the signed install.
          for animal in fox rabbit frog owl panda wolf; do
            grep -Fx "assets/flutter_assets/assets/images/animal_gems/${animal}.png" /tmp/packed-apk-entries.txt
          done
          # Removed Adventure world and battle images must be absent.
          ! grep -F 'assets/images/adventure_worlds/' /tmp/packed-apk-entries.txt
          ! grep -F 'assets/images/adventure_battles/' /tmp/packed-apk-entries.txt

      - name: Verify compiled MainActivity avoids deprecated bar colors
        working-directory: build_source
        run: |
          python tool/verify_system_bar_dex.py build/app/outputs/flutter-apk/app-release.apk

      - name: Audit Play Services BitmapFactory loader in compiled APK
        working-directory: build_source
        run: python tool/audit_play_services_bitmap.py build/app/outputs/flutter-apk/app-release.apk

      - name: Independent second-pass source and regression verification
        working-directory: build_source
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1
          python - <<'PY'
          from pathlib import Path
          s=Path('lib/screens/falling_blocks_screen.dart').read_text()
          assert 'RepaintBoundary(' in s
          assert 'onPanCancel: _onPanCancel' in s
          assert 'version: 0.33.3+86' in Path('pubspec.yaml').read_text()
          assert Path('lib/game/animal_match_engine.dart').is_file()
          assert Path('lib/game/falling_piece_bag.dart').is_file()
          assert Path('lib/services/animal_match_progress.dart').is_file()
          assert len(list(Path('assets/images/animal_gems').glob('*.png'))) == 6
          PY

      - name: Build signed Google Play AAB
        working-directory: build_source
        env:
          PG_CLASSIC: 'CgkI6arsvtAGEAIQAw'
          PG_RUSH: 'CgkI6arsvtAGEAIQAg'
          PG_ADVENTURE: 'CgkI6arsvtAGEAIQBA'
          ACH_FIRST: ${{ secrets.ELXVRO_PG_ACH_FIRST_GAME }}
